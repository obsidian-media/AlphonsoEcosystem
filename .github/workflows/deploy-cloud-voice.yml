name: Deploy Cloud Voice to AWS ECS

# Builds voice/cloud-backend, pushes to ECR, and deploys a new ECS task
# revision to the alphonso-cloud-voice service. Uses GitHub OIDC to assume
# a narrowly-scoped IAM role (ECR push to one repo, ECS deploy to one
# service, PassRole to only the two voice task roles) - no stored AWS
# credentials in this repo at all.
#
# This replaces the previous manual-only deployment process. The service
# had been running task definition revision 2 (registered 2026-08-01)
# unchanged for 5+ weeks despite real fixes landing on main since then -
# this workflow exists so that never happens silently again.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'voice/cloud-backend/**'
      - 'voice/shared/**'
      - '.github/workflows/deploy-cloud-voice.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: alphonso-cloud-voice
  ECS_CLUSTER: alphonso-cloud-voice
  ECS_SERVICE: cloud-voice-staging
  ECS_TASK_FAMILY: alphonso-cloud-voice
  CONTAINER_NAME: cloud-voice
  # Live-verified 2026-09-20 against a real chat/completions call (HTTP 200,
  # real content back) after NVIDIA retired the two models this was
  # previously set to (meta/llama-3.1-8b-instruct, then
  # meta/llama-3.3-70b-instruct - both 410 "reached its end of life", see
  # audits/2026-07-29_Codex_AWSVoiceMigration_Audit.md). Whoever changed it
  # to this value did so directly against the running ECS task definition,
  # never in git, so the fix was invisible here and could have silently
  # reverted or drifted on the next manual edit. Pinning it here makes the
  # model a real, git-tracked, code-reviewed change instead of tribal
  # knowledge living only in an ECS console/CLI action.
  NVIDIA_NIM_MODEL: meta/llama-3.2-11b-vision-instruct

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Never ship an untested backend to production (pre-launch audit).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run backend tests
        working-directory: voice/cloud-backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Configure AWS credentials (OIDC, no stored secrets)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: arn:aws:iam::892748149559:role/AlphonsoCloudVoiceDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push image
        id: build
        # Build context is voice/ (not voice/cloud-backend/) so the image can
        # also pick up voice/shared/voice_policy.json - see the Dockerfile's
        # own comment and app/voice_policy.py for the matching runtime path.
        working-directory: voice
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_TAG="gha-${GITHUB_SHA::8}-${GITHUB_RUN_ID}"
          docker build -f cloud-backend/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query 'taskDefinition' > task-definition.json

      # Pins NVIDIA_NIM_MODEL to the git-tracked value above on every deploy
      # (so it can never again silently drift from what's actually running),
      # and drops VOICE_ALLOW_OWNER_TESTING_BYPASS - a leftover env var from
      # a bypass mechanism that was deliberately removed from application
      # source entirely on 2026-08-10 as a security fix (it's inert today,
      # not a live hole, but a "true"-valued flag for removed code is
      # actively misleading to read in the running config).
      - name: Pin known-good runtime configuration
        env:
          NVIDIA_NIM_MODEL: ${{ env.NVIDIA_NIM_MODEL }}
        run: |
          set -euo pipefail
          jq --arg model "$NVIDIA_NIM_MODEL" '
            .containerDefinitions[0].environment = (
              [.containerDefinitions[0].environment[]
                | select(.name != "VOICE_ALLOW_OWNER_TESTING_BYPASS" and .name != "NVIDIA_NIM_MODEL")]
              + [{"name": "NVIDIA_NIM_MODEL", "value": $model}]
            )
          ' task-definition.json > task-definition.patched.json
          mv task-definition.patched.json task-definition.json

      # The backend defaults to invite-only (VOICE_ACCESS_MODE=invite). Deploying
      # it without an allowlist would lock every user out, so refuse instead of
      # silently shipping an unusable service.
      - name: Require an access policy in the task definition
        run: |
          set -euo pipefail
          mode=$(jq -r '[.containerDefinitions[0].environment[] | select(.name=="VOICE_ACCESS_MODE") | .value][0] // "invite"' task-definition.json)
          emails=$(jq -r '[.containerDefinitions[0].environment[] | select(.name=="VOICE_ALLOWED_EMAILS") | .value][0] // ""' task-definition.json)
          if [ "$mode" != "open" ] && [ -z "$emails" ]; then
            echo "::error::Task definition has no VOICE_ALLOWED_EMAILS and VOICE_ACCESS_MODE is not 'open'. Add invited emails (or set VOICE_ACCESS_MODE=open) to the ECS task definition before deploying."
            exit 1
          fi

      - name: Render new task definition with the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: Deploy to ECS and wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify health endpoint
        run: |
          set -euo pipefail
          sleep 10
          curl -sf https://voice.obsidianmedia.online/health
          echo ""
          curl -sf https://voice.obsidianmedia.online/ready
