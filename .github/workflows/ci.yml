name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm)
        run: npm audit --audit-level=high

      - name: Lint check
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Unit tests
        run: npm test

      - name: Check test coverage
        run: npm run test:coverage

      - name: Web build
        run: npm run build

      - name: Check bundle size
        shell: bash
        run: |
          TOTAL=$(du -sb dist/assets/ | awk '{print $1}')
          echo "Total bundle size: $TOTAL bytes"
          if [ "$TOTAL" -gt "10485760" ]; then
            echo "Bundle exceeds 10MB limit ($TOTAL bytes)"
            exit 1
          fi
          LARGEST=$(find dist/assets -name "*.js" -printf "%s\n" | sort -n | tail -1)
          if [ "$LARGEST" -gt "2097152" ]; then
            echo "Single JS chunk exceeds 2MB limit ($LARGEST bytes)"
            exit 1
          fi
          echo "Bundle size OK"

  rust-quality:
    name: Rust Tests & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Rust format check
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # Advisory audit runs LAST and with `if: always()` so a transitive-crate
      # advisory (e.g. a newly-yanked dependency) can never dark-out the fmt/
      # test/clippy quality gates by aborting the job before they run — which is
      # exactly what happened when `spin 0.9.8` was yanked. The gate still fails
      # the job on advisories; it just no longer masks the real quality checks.
      #
      # Truth-First plan B1 (2026-07-25): 17 RUSTSEC advisories are explicitly
      # ignored below by ID, each triaged and confirmed upstream-blocked, not
      # ignored blind. All 17 are "unmaintained"/"unsound" warnings, not
      # exploitable CVE-severity vulnerabilities. Two independent chains:
      #   - atk/atk-sys/gdk/gdk-sys/gdkwayland-sys/gdkx11/gdkx11-sys/gtk/
      #     gtk-sys/gtk3-macros/proc-macro-error/glib (12 advisories): pulled
      #     in exclusively via `libappindicator 0.9.0` <- `tray-icon 0.24.1`
      #     <- `tauri 2.11.5`'s Linux system-tray implementation
      #     (`cargo tree -i gtk` confirms this single path). `tray-icon` is
      #     already at its latest crates.io release (0.24.1) and `tauri` is
      #     already at its latest compatible 2.x release (2.11.5 — confirmed
      #     via `cargo update -p tauri --dry-run` finding nothing newer) —
      #     there is no available upgrade in our control that removes this
      #     chain today.
      #   - unic-char-property/unic-char-range/unic-common/unic-ucd-ident/
      #     unic-ucd-version (5 advisories): pulled in via `urlpattern 0.3.0`
      #     <- `tauri-utils 2.9.3` <- `tauri 2.11.5` (`cargo tree -i
      #     unic-char-property` confirms). A newer `urlpattern 0.6.0` exists
      #     upstream and likely drops these, but `tauri-utils` pins the
      #     `0.3.x` range and only Tauri itself can move that pin — same
      #     already-latest-compatible-version constraint as above.
      # Ignoring by specific advisory ID (not by crate or a blanket --deny
      # downgrade) means any NEW, different advisory against any of these
      # same crates still fails CI immediately — this list only silences the
      # 17 specific advisories reviewed on 2026-07-25.
      # Re-check trigger: next `tauri`/`tray-icon` release, or in any case
      # revisit by 2026-10-25 (3-month expiry) even if no release has
      # landed, and re-run `cargo audit` without --ignore to see if the list
      # can shrink.
      - name: Security audit (cargo)
        if: always()
        run: |
          cargo install cargo-audit
          cargo audit --file src-tauri/Cargo.lock --deny warnings \
            --ignore RUSTSEC-2024-0413 `# atk: unmaintained, gtk3-tray-icon chain` \
            --ignore RUSTSEC-2024-0416 `# atk-sys: unmaintained, gtk3-tray-icon chain` \
            --ignore RUSTSEC-2024-0412 `# gdk: unmaintained, gtk3-tray-icon chain` \
            --ignore RUSTSEC-2024-0418 `# gdk-sys: unmaintained, gtk3-tray-icon chain` \
            --ignore RUSTSEC-2024-0411 `# gdkwayland-sys: unmaintained, gtk3-tray-icon chain` \
            --ignore RUSTSEC-2024-0417 `# gdkx11: unmaintained, gtk3-tray-icon chain` \
            --ignore RUSTSEC-2024-0414 `# gdkx11-sys: unmaintained, gtk3-tray-icon chain` \
            --ignore RUSTSEC-2024-0415 `# gtk: unmaintained, gtk3-tray-icon chain` \
            --ignore RUSTSEC-2024-0420 `# gtk-sys: unmaintained, gtk3-tray-icon chain` \
            --ignore RUSTSEC-2024-0419 `# gtk3-macros: unmaintained, gtk3-tray-icon chain` \
            --ignore RUSTSEC-2024-0370 `# proc-macro-error: unmaintained, gtk3-tray-icon chain (via glib-macros)` \
            --ignore RUSTSEC-2024-0429 `# glib: unsound (GH Dependabot #3), gtk3-tray-icon chain` \
            --ignore RUSTSEC-2025-0081 `# unic-char-property: unmaintained, urlpattern/tauri-utils chain` \
            --ignore RUSTSEC-2025-0075 `# unic-char-range: unmaintained, urlpattern/tauri-utils chain` \
            --ignore RUSTSEC-2025-0080 `# unic-common: unmaintained, urlpattern/tauri-utils chain` \
            --ignore RUSTSEC-2025-0100 `# unic-ucd-ident: unmaintained, urlpattern/tauri-utils chain` \
            --ignore RUSTSEC-2025-0098 `# unic-ucd-version: unmaintained, urlpattern/tauri-utils chain`
        continue-on-error: false

      - name: Rust coverage (tarpaulin)
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --manifest-path src-tauri/Cargo.toml --out Xml --output-dir coverage-rust
        continue-on-error: true



  desktop:
    name: Tauri Desktop Build
    needs: [test, rust-quality]
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Ollama runtime
        run: node scripts/fetch-ollama-runtime.mjs windows-amd64

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Alphonso-${{ github.sha }}-x64-setup
          path: src-tauri/target/release/bundle/nsis/Alphonso_*_x64-setup.exe
          retention-days: 14

  desktop-macos:
    name: Tauri Desktop Build (macOS)
    needs: [test, rust-quality]
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Ollama runtime
        run: node scripts/fetch-ollama-runtime.mjs darwin-universal

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Alphonso-${{ github.sha }}-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14

  desktop-linux:
    name: Tauri Desktop Build (Linux)
    needs: [test, rust-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            zstd

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Ollama runtime
        run: node scripts/fetch-ollama-runtime.mjs linux-amd64

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Alphonso-${{ github.sha }}-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

      - name: Upload deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Alphonso-${{ github.sha }}-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 14

  secrets-scan:
    name: Secrets Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # base/head must differ or the action refuses to run ("BASE and HEAD
      # commits are the same") instead of skipping — on a direct push to
      # main, `base: main` and `head: HEAD` resolve to the exact same commit
      # (the one just pushed), so this job hard-failed on every push-to-main
      # for months with no real secret involved (T3). On PRs, diff against the
      # PR's base branch; on pushes, diff against the pre-push SHA so only the
      # newly pushed commits are scanned (falls back to a full scan when
      # `before` is the all-zero SHA, e.g. a brand-new branch).
      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '') }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --only-verified

  doc-freshness:
    name: Doc Count Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify doc counts are fresh
        run: npm run verify:docs

      - name: Verify agent skill-pack permission matrix is fresh
        run: npm run verify:skill-matrix

      # ADVISORY, not blocking: fixing the checker itself (it silently found
      # 0 files on Windows due to a path-separator bug, masking the real gap)
      # surfaced 124 genuinely undocumented files. Documenting all 124
      # accurately is real follow-up work, not something to rush through to
      # turn CI green — tracked as G-T19 in TRUTH_FIRST_EXECUTION_PLAN.md.
      # Flip continue-on-error to false once that backlog is cleared.
      - name: Verify "Do Not Duplicate" table covers every service/component
        run: npm run verify:dnd-coverage
        continue-on-error: true

  e2e:
    name: Playwright E2E Smoke Test
    needs: [test]
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Was TEMPORARY / ADVISORY (continue-on-error: true) from 2026-07-16
    # through 2026-08-22 — the suite hid its real state behind a
    # collection-time crash for months, then ~22/28 specs failed as stale
    # UI-interaction assertions once collection was fixed. Re-checked the
    # last 5 CI runs on main (2026-08-22) and all 5 show 28/28 passing — the
    # specs were fixed as a side effect of the real bugs closed in the same
    # window (chat leak, connector-status drift, workflow Run, etc.), the
    # advisory flag just never got removed. Roadmap T10 is now closed; this
    # job blocks merges again like every other gate.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium


      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        env:
          CI: true

  gateway-health:
    name: Gateway Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Check Gateway health endpoint
        env:
          GATEWAY_HEALTH_URL: ${{ secrets.GATEWAY_HEALTH_URL }}
        run: |
          if [ -z "$GATEWAY_HEALTH_URL" ]; then
            echo "::info::Gateway health check skipped (no GATEWAY_HEALTH_URL configured)"
            exit 0
          fi
          curl -s -o /dev/null -w "%{http_code}" "$GATEWAY_HEALTH_URL" || echo "Gateway health endpoint not reachable"
        continue-on-error: true

  ios-build:
    name: iOS Companion Build Check
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build iOS companion
        run: |
          cd ios/AlphonsoCompanion
          xcodebuild -scheme AlphonsoCompanion -destination 'platform=iOS Simulator,name=iPhone 16' -quiet build 2>&1 | tail -20
        continue-on-error: true

