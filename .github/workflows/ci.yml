name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: windows-latest
    # Keep a stalled dependency install/test process from preventing all
    # downstream desktop and Playwright jobs from ever receiving a result.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm)
        run: npm run verify:npm-audit

      # Desktop builds only run on main; this catches a Tauri crate/npm
      # version split on the PR instead of after the merge.
      - name: Verify Tauri crate and npm versions match
        run: npm run verify:tauri-versions

      - name: Lint check
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Unit tests
        run: npm test

      - name: Check test coverage
        run: npm run test:coverage

      - name: Web build
        run: npm run build

      - name: Check bundle size
        shell: bash
        run: |
          TOTAL=$(du -sb dist/assets/ | awk '{print $1}')
          echo "Total bundle size: $TOTAL bytes"
          if [ "$TOTAL" -gt "10485760" ]; then
            echo "Bundle exceeds 10MB limit ($TOTAL bytes)"
            exit 1
          fi
          LARGEST=$(find dist/assets -name "*.js" -printf "%s\n" | sort -n | tail -1)
          if [ "$LARGEST" -gt "2097152" ]; then
            echo "Single JS chunk exceeds 2MB limit ($LARGEST bytes)"
            exit 1
          fi
          echo "Bundle size OK"

  rust-quality:
    name: Rust Tests & Clippy
    runs-on: ubuntu-latest
    # Desktop build/E2E jobs depend on this gate; bound a stalled toolchain or
    # package download so the workflow eventually reports a result.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Rust format check
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Verify CREATE_NO_WINDOW coverage on all process spawns (T14)
        run: node scripts/verify-no-window-coverage.mjs

      - name: Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # Advisory audit runs LAST and with `if: always()` so a transitive-crate
      # advisory (e.g. a newly-yanked dependency) can never dark-out the fmt/
      # test/clippy quality gates by aborting the job before they run — which is
      # exactly what happened when `spin 0.9.8` was yanked. The gate still fails
      # the job on advisories; it just no longer masks the real quality checks.
      #
      # Truth-First plan B1 (2026-07-25): reviewed RUSTSEC advisories are
      # ignored by ID via .cargo/audit.toml (read by scripts/cargo-audit.sh),
      # each triaged and confirmed upstream-blocked, not
      # ignored blind. All 17 are "unmaintained"/"unsound" warnings, not
      # exploitable CVE-severity vulnerabilities. Two independent chains:
      #   - atk/atk-sys/gdk/gdk-sys/gdkwayland-sys/gdkx11/gdkx11-sys/gtk/
      #     gtk-sys/gtk3-macros/proc-macro-error/glib (12 advisories): pulled
      #     in exclusively via `libappindicator 0.9.0` <- `tray-icon 0.24.1`
      #     <- `tauri 2.11.5`'s Linux system-tray implementation
      #     (`cargo tree -i gtk` confirms this single path). `tray-icon` is
      #     already at its latest crates.io release (0.24.1) and `tauri` is
      #     already at its latest compatible 2.x release (2.11.5 — confirmed
      #     via `cargo update -p tauri --dry-run` finding nothing newer) —
      #     there is no available upgrade in our control that removes this
      #     chain today.
      #   - unic-char-property/unic-char-range/unic-common/unic-ucd-ident/
      #     unic-ucd-version (5 advisories): pulled in via `urlpattern 0.3.0`
      #     <- `tauri-utils 2.9.3` <- `tauri 2.11.5` (`cargo tree -i
      #     unic-char-property` confirms). A newer `urlpattern 0.6.0` exists
      #     upstream and likely drops these, but `tauri-utils` pins the
      #     `0.3.x` range and only Tauri itself can move that pin — same
      #     already-latest-compatible-version constraint as above.
      # Ignoring by specific advisory ID (not by crate or a blanket --deny
      # downgrade) means any NEW, different advisory against any of these
      # same crates still fails CI immediately — this list only silences the
      # 17 specific advisories reviewed on 2026-07-25.
      # Re-check trigger: next `tauri`/`tray-icon` release, or in any case
      # revisit by 2026-10-25 (3-month expiry) even if no release has
      # landed, and re-run `cargo audit` without --ignore to see if the list
      # can shrink.
      # Security update 2026-10-20: rustls 0.23.45 -> 0.23.46 removed the
      # three newly published rustls advisories. The remaining zip 4.6.1
      # advisories (RUSTSEC-2026-0367/0368/0369) are pulled exclusively by
      # tauri-plugin-updater 2.14.0, whose manifest still requires zip ^4;
      # zip 9 cannot be selected until the upstream plugin changes that
      # constraint. The updater verifies the Minisign signature over the
      # complete bytes before it extracts or installs them (confirmed from
      # tauri-plugin-updater 2.14.0 source), which is the compensating control
      # for the signed-release path. The zbus/zvariant advisories
      # (RUSTSEC-2026-0370/0371/0372) are unmaintained Linux notification/
      # opener transitive crates; they are not exploitable findings. These six IDs
      # are narrowly ignored pending upstream releases and must be rechecked
      # by 2026-11-20; any other advisory still fails this gate.
      - name: Security audit (cargo)
        if: always()
        # The ignore list lives in .cargo/audit.toml, with the reason for each
        # ID. The weekly security-audit workflow runs the same script.
        run: |
          cargo install cargo-audit --locked
          bash scripts/cargo-audit.sh
        continue-on-error: false

      - name: Rust coverage (tarpaulin)
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --manifest-path src-tauri/Cargo.toml --out Xml --output-dir coverage-rust
        continue-on-error: true



  desktop:
    name: Tauri Desktop Build
    needs: [test, rust-quality]
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Ollama runtime
        run: node scripts/fetch-ollama-runtime.mjs windows-amd64

      - name: Fetch bundled ffmpeg (LGPL)
        run: node scripts/fetch-ffmpeg.mjs

      # Deliberately NOT fetching the starter model here -- matches release.yml's
      # Windows job. Ollama's CUDA runtime plus the ~1.9GB model pushes the NSIS
      # payload past makensis's ~2GB mmap ceiling ("error mmapping file ... out of
      # range"), which broke this job on every main push from 2026-09-16 on.
      # Windows installs pull the model on first run via setupFlowService's
      # network fallback instead.

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      # The Windows counterpart of the Linux AppImage check below: a green
      # build alone does not prove the Ollama runtime staged by
      # fetch-ollama-runtime.mjs made it into the installer. 7-Zip ships on
      # GitHub's Windows images and can list an NSIS installer's files.
      - name: Verify bundled Ollama runtime is inside the NSIS installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter 'Alphonso_*_x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer found to verify' }
          $listing = & 7z l -slt $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not read the installer (exit $LASTEXITCODE)" }
          $entries = @()
          $current = $null
          foreach ($line in $listing) {
            if ($line -match '^Path = (.+)$') {
              if ($current) { $entries += [pscustomobject]$current }
              $current = @{ Path = $Matches[1]; Size = 0 }
            } elseif ($line -match '^Size = (\d+)$' -and $current) {
              $current.Size = [int64]$Matches[1]
            }
          }
          if ($current) { $entries += [pscustomobject]$current }
          $binary = $entries | Where-Object { $_.Path -match '(^|[\\/])ollama[\\/]ollama\.exe$' } | Select-Object -First 1
          if (-not $binary) {
            $entries | Where-Object { $_.Path -match 'ollama' } | Select-Object -First 20 | Format-Table -AutoSize | Out-String | Write-Host
            throw 'Bundled ollama.exe not found inside the NSIS installer -- the runtime was not packaged'
          }
          # The real executable is tens of MB; anything far smaller is a stub.
          if ($binary.Size -lt 10000000) { throw "Bundled ollama.exe is only $($binary.Size) bytes -- likely not the real executable" }
          Write-Host "Found bundled $($binary.Path) ($($binary.Size) bytes)"
          # The bundled ffmpeg (content factory phase 2a) must be there too.
          $ffmpeg = $entries | Where-Object { $_.Path -match '(^|[\\/])ffmpeg[\\/]ffmpeg\.exe$' } | Select-Object -First 1
          if (-not $ffmpeg) { throw 'Bundled ffmpeg.exe not found inside the NSIS installer' }
          Write-Host "Found bundled $($ffmpeg.Path) ($($ffmpeg.Size) bytes)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Alphonso-${{ github.sha }}-x64-setup
          path: src-tauri/target/release/bundle/nsis/Alphonso_*_x64-setup.exe
          retention-days: 14

  desktop-e2e:
    name: Desktop E2E (real Tauri binary)${{ matrix.suite == 'model' && ' with a local model' || '' }}
    needs: [test, rust-quality]
    # Jose phase 7: the specs that need a model ran nowhere in CI (they skip without Ollama). The
    # "model" run starts Ollama with one small model and runs just those specs.
    strategy:
      fail-fast: false
      matrix:
        suite: [plain, model]
    env:
      CI_TEST_MODEL: qwen2.5:1.5b
    # windows-latest now resolves to the Windows Server 2025 image, whose
    # WebView2/EdgeDriver stack fails every tauri-driver session with
    # "DevToolsActivePort file doesn't exist". Keep real desktop coverage on
    # the known-good Windows 2022 image until the runner-image regression is
    # resolved upstream.
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.suite == 'model' && 150 || 35 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install EdgeDriver
        shell: pwsh
        run: |
          $webViewRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          $webView = Get-ChildItem -Path $webViewRoot -Filter msedgewebview2.exe -Recurse -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $webView) {
            throw "Microsoft Edge WebView2 runtime was not found under $webViewRoot."
          }
          $browserVersion = $webView.VersionInfo.ProductVersion
          $driverVersion = ($browserVersion -split '\.')[0..2] -join '.'
          $driverRoot = Join-Path $env:RUNNER_TEMP 'alphonso-msedgedriver'
          $archive = Join-Path $env:RUNNER_TEMP "msedgedriver-$browserVersion.zip"
          New-Item -ItemType Directory -Force -Path $driverRoot | Out-Null
          Write-Host "WebView2 version: $browserVersion"
          $downloadUrl = "https://msedgedriver.microsoft.com/$browserVersion/edgedriver_win64.zip"
          Write-Host "Downloading matching EdgeDriver: $downloadUrl"
          try {
            Invoke-WebRequest -Uri $downloadUrl -OutFile $archive -ErrorAction Stop
          } catch {
            $releaseUrl = "https://msedgedriver.microsoft.com/LATEST_RELEASE_$driverVersion"
            Write-Warning "Exact EdgeDriver archive was unavailable; trying compatible release lookup: $releaseUrl"
            $resolvedDriverVersion = (Invoke-WebRequest -Uri $releaseUrl -ErrorAction Stop).Content.Trim()
            if ([string]::IsNullOrWhiteSpace($resolvedDriverVersion)) {
              throw "Microsoft EdgeDriver release lookup returned no version for WebView2 $driverVersion."
            }
            $downloadUrl = "https://msedgedriver.microsoft.com/$resolvedDriverVersion/edgedriver_win64.zip"
            Write-Host "Resolved compatible EdgeDriver version: $resolvedDriverVersion"
            Invoke-WebRequest -Uri $downloadUrl -OutFile $archive -ErrorAction Stop
          }
          Expand-Archive -Path $archive -DestinationPath $driverRoot -Force
          $driver = Get-ChildItem -Path $driverRoot -Filter msedgedriver.exe -Recurse -File | Select-Object -First 1
          if (-not $driver) {
            throw "Matching msedgedriver.exe was not found after extracting $archive."
          }
          $actualDriverVersion = (& $driver.FullName --version | Select-Object -First 1)
          Write-Host "EdgeDriver: $actualDriverVersion"
          if ($actualDriverVersion -notmatch "^(?:MSEdgeDriver|Microsoft Edge WebDriver)\s+$driverVersion\.") {
            throw "EdgeDriver major/minor/build does not match WebView2 ${browserVersion}: $actualDriverVersion"
          }
          "ALPHONSO_E2E_EDGEDRIVER=$($driver.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm ci

      - name: Install tauri-driver
        shell: pwsh
        run: cargo install tauri-driver --locked --version "^2"

      # content-video.e2e.mjs assembles a real video with the bundled ffmpeg.
      - name: Fetch bundled ffmpeg (LGPL)
        run: node scripts/fetch-ffmpeg.mjs

      - name: Build debug Tauri binary
        run: npm run tauri build -- --debug --no-bundle

      # The debug app for the by-hand live checks (QA batch 1): Smart App Control on the dev
      # machine blocks freshly built Rust files, so the live checks run on this build instead.
      - name: Upload the debug app for live checks
        if: matrix.suite == 'plain'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: alphonso-debug-app-${{ github.sha }}
          path: src-tauri/target/debug/app.exe
          retention-days: 3

      - name: Run desktop E2E suite
        if: matrix.suite == 'plain'
        run: npm run test:e2e:desktop

      # The model run: Ollama from the pinned runtime, one small model, then only the model specs.
      # OLLAMA_ORIGINS lets the app window reach it (never tauri://localhost: Ollama panics on it).
      - name: Start Ollama with the test model
        if: matrix.suite == 'model'
        shell: pwsh
        run: |
          node scripts/fetch-ollama-runtime.mjs windows-amd64
          $ollama = Get-ChildItem -Path src-tauri/vendor/ollama -Filter ollama.exe -Recurse -File | Select-Object -First 1
          if (-not $ollama) { throw 'ollama.exe was not found after fetching the runtime.' }
          $env:OLLAMA_ORIGINS = 'http://tauri.localhost'
          Start-Process -FilePath $ollama.FullName -ArgumentList 'serve' -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod -Uri http://127.0.0.1:11434/api/tags | Out-Null; break } catch { Start-Sleep -Seconds 2 }
          }
          & $ollama.FullName pull $env:CI_TEST_MODEL
          "ALPHONSO_E2E_MODEL=$env:CI_TEST_MODEL" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run the model specs
        if: matrix.suite == 'model'
        run: >-
          npm run test:e2e:desktop --
          --spec e2e-desktop/specs/chat.e2e.mjs
          --spec e2e-desktop/specs/jose-planner.e2e.mjs
          --spec e2e-desktop/specs/agent-roles.e2e.mjs
          --spec e2e-desktop/specs/agent-skills.e2e.mjs
          --spec e2e-desktop/specs/hector.e2e.mjs
          --spec e2e-desktop/specs/nova.e2e.mjs
          --spec e2e-desktop/specs/maria.e2e.mjs
          --spec e2e-desktop/specs/marcus.e2e.mjs
          --spec e2e-desktop/specs/echo.e2e.mjs
          --spec e2e-desktop/specs/alphonso.e2e.mjs
          --spec e2e-desktop/specs/jose-phase7.e2e.mjs

  desktop-macos:
    name: Tauri Desktop Build (macOS)
    needs: [test, rust-quality]
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Ollama runtime
        run: node scripts/fetch-ollama-runtime.mjs darwin-universal

      # Deliberately NOT fetching the starter model here -- matches release.yml's
      # macOS job (PR #249), so CI builds the same artifact shape that ships.

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Alphonso-${{ github.sha }}-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14

  desktop-linux:
    name: Tauri Desktop Build (Linux)
    needs: [test, rust-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            patchelf \
            zstd

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Ollama runtime
        run: node scripts/fetch-ollama-runtime.mjs linux-amd64

      # Closing phase (owner, 2026-10-30): the AppImage bundles ffmpeg like the Windows installer.
      - name: Fetch bundled ffmpeg (LGPL)
        run: node scripts/fetch-ffmpeg.mjs linux

      # Deliberately NOT fetching the starter model here, as on Windows and macOS.
      # The 2.11.0 AppImage (starter model plus the ffmpeg added in the closing
      # phase) came to about 2.08 GB, over GitHub's 2 GiB limit for one release
      # file ("size must be less than 2147483648"), so 2.11.0 shipped without
      # Linux. Setup downloads the model on first run (setupFlowService's
      # network fallback), as it already does on the other two.

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # ubuntu-latest's runner has no FUSE userspace mount available;
          # forcing extract-and-run mode avoids needing FUSE for the
          # downloaded linuxdeploy/AppRun AppImage tools.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        # --verbose: Tauri's bundler swallows the real subprocess stderr at
        # normal verbosity, which hid the actual Linux AppImage bundling
        # failure (an RPATH resolution limit in linuxdeploy, fixed in
        # scripts/fetch-ollama-runtime.mjs — see that file's comment) behind
        # a generic "failed to run linuxdeploy" for months. Kept for future
        # diagnosability.
        run: npm run tauri build -- --verbose

      # Every prior check here only asserted "linuxdeploy exited 0" -- nothing
      # verified the produced AppImage actually contains the bundled Ollama
      # runtime that scripts/fetch-ollama-runtime.mjs staged into
      # bundle.resources. A regression in that staging, a fetch-script
      # change, or a linuxdeploy behaviour change could silently ship an
      # AppImage with no runtime inside it and this job would still stay
      # green. --appimage-extract needs no special tooling on GitHub's
      # ubuntu runners and takes seconds.
      - name: Verify bundled Ollama runtime and ffmpeg are inside the AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name "*.AppImage" | head -n 1)
          if [ -z "$appimage" ]; then
            echo "No AppImage found to verify" >&2
            exit 1
          fi
          chmod +x "$appimage"
          workdir=$(mktemp -d)
          (cd "$workdir" && APPIMAGE_EXTRACT_AND_RUN=1 "$OLDPWD/$appimage" --appimage-extract >/dev/null)
          binary=$(find "$workdir/squashfs-root" -type f -path "*/ollama/ollama" | head -n 1)
          if [ -z "$binary" ]; then
            echo "Bundled ollama binary not found inside the AppImage -- the runtime was not packaged" >&2
            find "$workdir/squashfs-root" -iname "*ollama*" >&2 || true
            exit 1
          fi
          size=$(stat -c%s "$binary")
          echo "Found bundled ollama binary: $binary ($size bytes)"
          # The real ollama executable is tens of MB; anything drastically
          # smaller would mean a stub/empty file got bundled instead.
          if [ "$size" -lt 10000000 ]; then
            echo "Bundled ollama binary is suspiciously small ($size bytes) -- likely not the real executable" >&2
            exit 1
          fi
          # The bundled ffmpeg must be inside and must start: it loads its libraries from ../lib.
          ffmpeg=$(find "$workdir/squashfs-root" -type f -path "*/ffmpeg/bin/ffmpeg" | head -n 1)
          if [ -z "$ffmpeg" ]; then
            echo "Bundled ffmpeg not found inside the AppImage" >&2
            exit 1
          fi
          "$ffmpeg" -hide_banner -version | head -n 1
          rm -rf "$workdir"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Alphonso-${{ github.sha }}-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

      - name: Upload deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Alphonso-${{ github.sha }}-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 14

  secrets-scan:
    name: Secrets Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # base/head must differ or the action refuses to run ("BASE and HEAD
      # commits are the same") instead of skipping — on a direct push to
      # main, `base: main` and `head: HEAD` resolve to the exact same commit
      # (the one just pushed), so this job hard-failed on every push-to-main
      # for months with no real secret involved (T3). On PRs, diff against the
      # PR's base branch; on pushes, diff against the pre-push SHA so only the
      # newly pushed commits are scanned (falls back to a full scan when
      # `before` is the all-zero SHA, e.g. a brand-new branch).
      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '') }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --only-verified

  doc-freshness:
    name: Doc Count Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify doc counts are fresh
        run: npm run verify:docs

      - name: Verify generated Do Not Duplicate inventory is fresh
        run: npm run verify:dnd-map

      # Blocking as of 2026-09-02: the 124-file backlog this check surfaced
      # (see G-T19 in TRUTH_FIRST_EXECUTION_PLAN.md) has been fully documented
      # in CLAUDE.md's "Do Not Duplicate" table. Keep this blocking — a new
      # undocumented file should fail CI immediately, not accumulate again.
      - name: Verify "Do Not Duplicate" table covers every service/component
        run: npm run verify:dnd-coverage

  e2e:
    name: Playwright E2E Smoke Test
    needs: [test]
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Was TEMPORARY / ADVISORY (continue-on-error: true) from 2026-07-16
    # through 2026-08-22 — the suite hid its real state behind a
    # collection-time crash for months, then ~22/28 specs failed as stale
    # UI-interaction assertions once collection was fixed. Re-checked the
    # last 5 CI runs on main (2026-08-22) and all 5 show 28/28 passing — the
    # specs were fixed as a side effect of the real bugs closed in the same
    # window (chat leak, connector-status drift, workflow Run, etc.), the
    # advisory flag just never got removed. Roadmap T10 is now closed; this
    # job blocks merges again like every other gate.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium


      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        env:
          CI: true

  gateway-health:
    name: Gateway Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Check Gateway health endpoint
        env:
          GATEWAY_HEALTH_URL: ${{ secrets.GATEWAY_HEALTH_URL }}
        run: |
          if [ -z "$GATEWAY_HEALTH_URL" ]; then
            echo "::info::Gateway health check skipped (no GATEWAY_HEALTH_URL configured)"
            exit 0
          fi
          curl -s -o /dev/null -w "%{http_code}" "$GATEWAY_HEALTH_URL" || echo "Gateway health endpoint not reachable"
        continue-on-error: true

  service-tests:
    name: Cloud Voice & Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Gateway queue tests
        run: node --test gateway/generic-webhook/src/leaseQueue.test.mjs gateway/whatsapp-cloud/src/leaseQueue.test.mjs

      - name: Phone relay tests
        run: |
          npm ci --prefix gateway/phone-relay --no-audit --no-fund
          node --test gateway/phone-relay/src/relay.test.mjs gateway/phone-relay/src/server.test.mjs

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cloud Voice backend tests
        working-directory: voice/cloud-backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

  ios-build:
    name: iOS Companion Build Check
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build iOS companion
        run: |
          cd ios/AlphonsoCompanion
          xcodebuild -scheme AlphonsoCompanion -destination 'platform=iOS Simulator,name=iPhone 16' -quiet build 2>&1 | tail -20
        continue-on-error: true

