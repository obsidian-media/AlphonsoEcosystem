name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.0)'
        required: true
        type: string
      publish:
        description: 'Publish the GitHub Release. Leave off to build and check all three installers without releasing anything.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-tag:
    name: Determine release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.version }}"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag provided" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "Release tag: $TAG"
          echo "Version: $VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build & Sign (Windows)
    needs: determine-tag
    runs-on: windows-latest
    outputs:
      installer_name: ${{ steps.collect.outputs.installer_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify app (lint + test + build)
        run: npm run verify:app

      - name: Rust tests & clippy
        working-directory: src-tauri
        run: |
          cargo test
          cargo clippy -- -D warnings

      - name: Fetch bundled Ollama runtime
        run: node scripts/fetch-ollama-runtime.mjs windows-amd64

      - name: Fetch bundled ffmpeg (LGPL)
        run: node scripts/fetch-ffmpeg.mjs

      # Deliberately NOT fetching the starter model here, unlike Linux/macOS.
      # This is the same class of bug already hit and fixed once before
      # (DEPENDENCY_BUNDLING_PLAN.md's O5 entry, 2026-08-21) - makensis has a
      # hard data-block mmap size limit ("error mmapping file ... is out of
      # range"), previously worked around by dropping the cuda_v13 Ollama
      # runtime variant. Adding the ~1.9GB starter model (O2) back on top
      # pushed Windows over that same limit again (v2.8.0 release run
      # 34323883519 failed here; Linux's AppImage/squashfs has no equivalent
      # block-size ceiling, so it built fine with the model bundled).
      # `installComponent()` already has a real network-pull fallback for a
      # missing bundled model, so Windows users get it on first launch
      # instead of at install time - a real, already-built fallback path,
      # not a stub.
      - name: Build signed Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx.cmd tauri build

      - name: Collect artifacts
        id: collect
        shell: pwsh
        run: |
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -LiteralPath $nsisDir -Filter "*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "NSIS installer not found in $nsisDir"
            exit 1
          }
          $sig = Get-Item "$($installer.FullName).sig"
          if (-not $sig) {
            Write-Error "Signature file not found: $($installer.FullName).sig"
            exit 1
          }
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Signature: $($sig.Name)"
          Copy-Item $installer.FullName "./$($installer.Name)"
          Copy-Item $sig.FullName "./$($sig.Name)"
          "installer_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sig_name=$($sig.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-assets
          path: |
            ${{ steps.collect.outputs.installer_name }}
            ${{ steps.collect.outputs.sig_name }}
          retention-days: 1

  build-macos:
    name: Build & Sign (macOS)
    needs: determine-tag
    runs-on: macos-latest
    outputs:
      installer_name: ${{ steps.collect.outputs.installer_name }}
      updater_name: ${{ steps.collect.outputs.updater_name }}
      notarized: ${{ steps.apple_cert.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Ollama runtime
        run: node scripts/fetch-ollama-runtime.mjs darwin-universal

      # Deliberately NOT fetching the starter model here, same reasoning as
      # build-windows above but a different real constraint: the first real
      # v2.8.0 publish attempt (run 34407729115) built successfully but
      # failed at upload - the DMG came out to 2,185,285,094 bytes (~2.03GiB)
      # with the model bundled, and GitHub Releases hard-caps a single asset
      # at 2147483648 bytes (2GiB): "Validation Failed: size must be less
      # than 2147483648". Windows/Linux were unaffected (Windows already
      # skips the model for the unrelated NSIS block-size bug; Linux's
      # AppImage came in under the limit even with the model bundled).
      # Same fallback applies: installComponent() pulls it over the network
      # on first launch if not bundled.
      # Apple Developer ID signing + notarization. Entirely optional: when the
      # APPLE_* secrets are absent this job still produces the same unsigned
      # DMG as before. Required secrets (see docs/MACOS_SIGNING.md):
      #   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD   .p12 export password
      #   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_ID                     Apple ID email used for notarization
      #   APPLE_PASSWORD               app-specific password for that Apple ID
      #   APPLE_TEAM_ID                10-character team id
      - name: Import Apple signing certificate
        id: apple_cert
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Signing starts only when the Developer ID certificate itself is
          # present. Without it the build is explicitly UNSIGNED and labeled
          # that way. APPLE_TEAM_ID alone does not count: the iOS pipeline
          # uses that secret too, and it used to make this step fail every
          # macOS release as "partially configured".
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!name:-}" ]; then echo "::notice::$name is set but APPLE_CERTIFICATE is not; it is ignored for macOS signing."; fi
            done
            echo "::warning::No APPLE_CERTIFICATE secret -- building an UNSIGNED, un-notarized DMG. See docs/MACOS_SIGNING.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # With the certificate present, all six are required together, so a
          # release can never be mislabeled as signed/notarized.
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Apple signing is partially configured; missing:${missing}"
            echo "::error::Provide all six APPLE_* secrets or remove the partial set before releasing."
            exit 1
          fi
          keychain="$RUNNER_TEMP/alphonso-signing.keychain-db"
          keychainPw="$(uuidgen)"
          certPath="$RUNNER_TEMP/apple-cert.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certPath"
          security create-keychain -p "$keychainPw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychainPw" "$keychain"
          security import "$certPath" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychainPw" "$keychain"
          # Keep the user's existing keychains searchable. Read them line by line:
          # an unquoted $(...) would word-split any path containing spaces.
          existing=()
          while IFS= read -r line; do
            k=$(printf '%s' "$line" | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
            if [ -n "$k" ]; then existing+=("$k"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" ${existing[@]+"${existing[@]}"}
          rm -f "$certPath"
          security find-identity -v -p codesigning "$keychain"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Tauri signs the app binary but treats vendor/ollama as opaque resource
      # files. Apple's notary service rejects any unsigned or non-hardened
      # Mach-O anywhere in the bundle, so sign the bundled Ollama runtime
      # (executables and dylibs) ourselves first. Tauri then signs the .app.
      - name: Sign bundled Ollama runtime (hardened runtime)
        if: steps.apple_cert.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$f"
              count=$((count + 1))
            fi
          done < <(find src-tauri/vendor/ollama -type f -print0)
          echo "Signed $count Mach-O files in src-tauri/vendor/ollama"
          if [ "$count" -eq 0 ]; then
            echo "No Mach-O files found under src-tauri/vendor/ollama -- runtime was not staged" >&2
            exit 1
          fi

      - name: Build signed Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_ENABLED: ${{ steps.apple_cert.outputs.enabled }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Exporting APPLE_SIGNING_IDENTITY makes Tauri sign with the hardened
          # runtime; APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID make it notarize and
          # staple. They must be UNSET, not empty, for an unsigned build: with
          # APPLE_SIGNING_IDENTITY="" Tauri still runs `codesign -s ""`, which
          # fails with "no identity found" and takes the whole release down
          # (this broke the first v2.9.0 release run).
          if [ "$APPLE_SIGNING_ENABLED" = "true" ]; then
            export APPLE_SIGNING_IDENTITY="$SECRET_APPLE_SIGNING_IDENTITY"
            export APPLE_ID="$SECRET_APPLE_ID"
            export APPLE_PASSWORD="$SECRET_APPLE_PASSWORD"
            export APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
          else
            echo "Apple signing not configured: building an UNSIGNED, un-notarized app."
          fi
          npm run tauri build -- --target aarch64-apple-darwin --verbose

      - name: Verify Gatekeeper accepts the app (notarized builds only)
        if: steps.apple_cert.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$app" ]; then
            echo "No .app bundle found under bundle/macos for Gatekeeper verification" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      # Tauri produces two distinct macOS artifacts, not one: the DMG (manual
      # installer, what a user downloads and drags to Applications) and a
      # separate bundle/macos/*.app.tar.gz + .sig (the actual auto-updater
      # payload Tauri's updater checks against latest.json - NOT the DMG).
      # Collect both; the updater manifest below must reference the
      # .app.tar.gz, not the DMG, or the auto-update mechanism silently
      # can't verify/apply updates on macOS.
      # Confirmed via a real failed run (34404597598): Tauri does NOT sign
      # the DMG - "Finished 1 updater signature at: .../Alphonso.app.tar.gz.sig"
      # is the ONLY .sig produced. Windows/Linux each have one artifact that
      # serves as both the manual installer and the signed updater payload,
      # so it was wrong to assume macOS's DMG would also get a .sig - it
      # never does, by Tauri's own design (the DMG and the updater archive
      # are two genuinely separate bundle outputs here).
      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          dmgDir="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          installer=$(find "$dmgDir" -maxdepth 1 -name "*.dmg" | head -n 1)
          if [ -z "$installer" ]; then
            echo "DMG not found in $dmgDir" >&2
            exit 1
          fi

          updaterDir="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          updater=$(find "$updaterDir" -maxdepth 1 -name "*.app.tar.gz" | head -n 1)
          if [ -z "$updater" ]; then
            echo "Updater .app.tar.gz not found in $updaterDir" >&2
            exit 1
          fi
          updaterSig="${updater}.sig"
          if [ ! -f "$updaterSig" ]; then
            echo "Updater signature file not found: $updaterSig" >&2
            exit 1
          fi

          echo "Installer (unsigned DMG, manual install only): $(basename "$installer")"
          echo "Updater archive: $(basename "$updater")"
          echo "Updater signature: $(basename "$updaterSig")"
          cp "$installer" "./$(basename "$installer")"
          cp "$updater" "./$(basename "$updater")"
          cp "$updaterSig" "./$(basename "$updaterSig")"
          echo "installer_name=$(basename "$installer")" >> "$GITHUB_OUTPUT"
          echo "updater_name=$(basename "$updater")" >> "$GITHUB_OUTPUT"
          echo "updater_sig_name=$(basename "$updaterSig")" >> "$GITHUB_OUTPUT"

      # Real release assets get published from this job -- verifying the
      # bundled Ollama runtime actually made it into the .app bundle here
      # matters even more than in ci.yml's advisory build, since this is
      # what a real user downloads. Same check, same rationale as
      # build-linux's AppImage verification below. Note: this does NOT
      # verify Gatekeeper/notarization status -- that happens in the
      # "Verify Gatekeeper accepts the app" step above, and only when the
      # APPLE_* secrets are configured (see docs/MACOS_SIGNING.md).
      - name: Verify bundled Ollama runtime is inside the app bundle
        shell: bash
        run: |
          set -euo pipefail
          # The v2.9.0 release run died here in 90 ms with no message: the
          # old `hdiutil attach -quiet` failed silently under `set -e`. Every
          # step below now says what it checked and why it failed.
          check_binary() {
            # $1 = label, $2 = path to the ollama binary (may be empty)
            if [ -z "$2" ] || [ ! -f "$2" ]; then
              echo "::error::$1: bundled ollama binary not found -- the runtime was not packaged"
              return 1
            fi
            size=$(wc -c < "$2" | tr -d ' ')
            echo "$1: found $2 ($size bytes)"
            if [ "$size" -lt 10000000 ]; then
              echo "::error::$1: ollama binary is only $size bytes -- not the real executable"
              return 1
            fi
          }

          # 1. The updater archive: what auto-update installs.
          updater="./${{ steps.collect.outputs.updater_name }}"
          work=$(mktemp -d)
          tar -xzf "$updater" -C "$work"
          check_binary "updater archive" "$(find "$work" -type f -path '*/Contents/Resources/*ollama/ollama' -print -quit)"
          rm -rf "$work"

          # 2. The DMG: what a new user downloads.
          dmg="./${{ steps.collect.outputs.installer_name }}"
          mountpoint=$(mktemp -d)
          attached=false
          for attempt in 1 2 3; do
            # The DMG carries the EULA (tauri.conf.json bundle.licenseFile),
            # so mounting it asks the user to agree first. With no one to
            # answer, hdiutil prints "attach canceled" -- the real reason the
            # v2.9.0 and first v2.10.0 dry-run checks failed. Answer "Y".
            # pipefail is off inside the subshell so `yes` exiting on SIGPIPE
            # does not count as a failure.
            if (set +o pipefail; yes | PAGER=cat hdiutil attach "$dmg" -mountpoint "$mountpoint" -nobrowse -readonly -noverify >/dev/null); then
              attached=true
              break
            fi
            echo "hdiutil attach failed (attempt $attempt); retrying in 5s"
            sleep 5
          done
          if [ "$attached" != true ]; then
            echo "::error::Could not mount $dmg to check its contents"
            exit 1
          fi
          status=0
          app=$(find "$mountpoint" -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$app" ]; then
            echo "::error::No .app bundle found inside the DMG"
            ls -la "$mountpoint" || true
            status=1
          else
            check_binary "DMG" "$(find "$app" -type f -path '*/Contents/Resources/*ollama/ollama' -print -quit)" || status=1
          fi
          hdiutil detach "$mountpoint" -force || true
          exit "$status"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-release-assets
          path: |
            ${{ steps.collect.outputs.installer_name }}
            ${{ steps.collect.outputs.updater_name }}
            ${{ steps.collect.outputs.updater_sig_name }}
          retention-days: 1

  build-linux:
    name: Build & Sign (Linux)
    needs: determine-tag
    runs-on: ubuntu-latest
    outputs:
      installer_name: ${{ steps.collect.outputs.installer_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            patchelf \
            zstd

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Ollama runtime
        run: node scripts/fetch-ollama-runtime.mjs linux-amd64

      # Closing phase (owner, 2026-10-30): the AppImage bundles ffmpeg like the Windows installer.
      - name: Fetch bundled ffmpeg (LGPL)
        run: node scripts/fetch-ffmpeg.mjs linux

      - name: Fetch bundled starter model
        run: node scripts/fetch-starter-model.mjs

      - name: Build signed Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ubuntu-latest's runner has no FUSE userspace mount available;
          # forcing extract-and-run mode avoids needing FUSE for the
          # downloaded linuxdeploy/AppRun AppImage tools. Same fix as
          # ci.yml's desktop-linux job.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri build -- --verbose

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          appimageDir="src-tauri/target/release/bundle/appimage"
          installer=$(find "$appimageDir" -maxdepth 1 -name "*.AppImage" | head -n 1)
          if [ -z "$installer" ]; then
            echo "AppImage not found in $appimageDir" >&2
            exit 1
          fi
          sig="${installer}.sig"
          if [ ! -f "$sig" ]; then
            echo "Signature file not found: $sig" >&2
            exit 1
          fi
          echo "Installer: $(basename "$installer")"
          echo "Signature: $(basename "$sig")"
          cp "$installer" "./$(basename "$installer")"
          cp "$sig" "./$(basename "$sig")"
          echo "installer_name=$(basename "$installer")" >> "$GITHUB_OUTPUT"
          echo "sig_name=$(basename "$sig")" >> "$GITHUB_OUTPUT"

      # Real release assets get published from this job -- verifying the
      # bundled Ollama runtime actually made it into the AppImage here
      # matters even more than in ci.yml's advisory build, since this is
      # what a real user downloads. Same check, same rationale as
      # ci.yml's "Verify bundled Ollama runtime is inside the AppImage" step.
      - name: Verify bundled Ollama runtime and ffmpeg are inside the AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage="./${{ steps.collect.outputs.installer_name }}"
          chmod +x "$appimage"
          workdir=$(mktemp -d)
          (cd "$workdir" && APPIMAGE_EXTRACT_AND_RUN=1 "$OLDPWD/$appimage" --appimage-extract >/dev/null)
          binary=$(find "$workdir/squashfs-root" -type f -path "*/ollama/ollama" | head -n 1)
          if [ -z "$binary" ]; then
            echo "Bundled ollama binary not found inside the release AppImage -- the runtime was not packaged" >&2
            find "$workdir/squashfs-root" -iname "*ollama*" >&2 || true
            exit 1
          fi
          size=$(stat -c%s "$binary")
          echo "Found bundled ollama binary: $binary ($size bytes)"
          if [ "$size" -lt 10000000 ]; then
            echo "Bundled ollama binary is suspiciously small ($size bytes) -- likely not the real executable" >&2
            exit 1
          fi
          # The bundled ffmpeg must be inside and must start: it loads its libraries from ../lib.
          ffmpeg=$(find "$workdir/squashfs-root" -type f -path "*/ffmpeg/bin/ffmpeg" | head -n 1)
          if [ -z "$ffmpeg" ]; then
            echo "Bundled ffmpeg not found inside the AppImage" >&2
            exit 1
          fi
          "$ffmpeg" -hide_banner -version | head -n 1
          rm -rf "$workdir"

      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-release-assets
          path: |
            ${{ steps.collect.outputs.installer_name }}
            ${{ steps.collect.outputs.sig_name }}
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [determine-tag, build-windows, build-macos, build-linux]
    # A manual run only publishes when asked to; a tag push always does.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      # Owner decision 2026-10-21: until a Developer ID certificate exists,
      # ship an unsigned macOS DMG (as v2.8.0 did) instead of no macOS build.
      # The release notes say so plainly. This replaces a hard stop added in
      # PR #304 that blocked every platform's release over macOS signing.
      - name: Report macOS signing status
        shell: bash
        env:
          NOTARIZED: ${{ needs.build-macos.outputs.notarized }}
        run: |
          if [ "$NOTARIZED" = "true" ]; then
            echo "macOS artifact is signed and notarized."
          else
            echo "::warning::Publishing an UNSIGNED, un-notarized macOS DMG. Users must right-click > Open on first launch. See docs/MACOS_SIGNING.md."
          fi

      - name: Download Windows release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-assets
          path: dist/windows

      - name: Download macOS release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release-assets
          path: dist/macos

      - name: Download Linux release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release-assets
          path: dist/linux

      - name: Generate combined updater manifest
        id: manifest
        shell: bash
        run: |
          TAG="${{ needs.determine-tag.outputs.tag }}"
          VERSION="${{ needs.determine-tag.outputs.version }}"
          BASE_URL="https://github.com/obsidian-media/AlphonsoEcosystem/releases/download/$TAG"

          WIN_INSTALLER="${{ needs.build-windows.outputs.installer_name }}"
          WIN_SIG=$(cat "dist/windows/${WIN_INSTALLER}.sig")

          # The updater manifest must reference the .app.tar.gz updater
          # archive, not the DMG -- Tauri's updater downloads and verifies
          # this file, never the DMG (that's the manual-install path only).
          MACOS_UPDATER="${{ needs.build-macos.outputs.updater_name }}"
          MACOS_SIG=$(cat "dist/macos/${MACOS_UPDATER}.sig")

          LINUX_INSTALLER="${{ needs.build-linux.outputs.installer_name }}"
          LINUX_SIG=$(cat "dist/linux/${LINUX_INSTALLER}.sig")

          python3 - "$VERSION" "$WIN_SIG" "$WIN_INSTALLER" "$MACOS_SIG" "$MACOS_UPDATER" "$LINUX_SIG" "$LINUX_INSTALLER" "$BASE_URL" <<'PYEOF'
          import json, sys, datetime
          version, win_sig, win_installer, macos_sig, macos_updater, linux_sig, linux_installer, base_url = sys.argv[1:9]
          manifest = {
              "version": version,
              "notes": f"Alphonso {version} release",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": win_sig.strip(),
                      "url": f"{base_url}/{win_installer}"
                  },
                  "darwin-aarch64": {
                      "signature": macos_sig.strip(),
                      "url": f"{base_url}/{macos_updater}"
                  },
                  "linux-x86_64": {
                      "signature": linux_sig.strip(),
                      "url": f"{base_url}/{linux_installer}"
                  }
              }
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PYEOF
          echo "manifest_path=latest.json" >> "$GITHUB_OUTPUT"

      - name: Validate updater manifest
        run: |
          python3 -c "import json,sys; d=json.load(open('latest.json')); required=['version','platforms']; missing=[k for k in required if k not in d]; assert not missing, missing; assert 'windows-x86_64' in d['platforms']; assert 'darwin-aarch64' in d['platforms']; assert 'linux-x86_64' in d['platforms']; print('Manifest OK:', d['version'])"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.determine-tag.outputs.tag }}
          name: Alphonso ${{ needs.determine-tag.outputs.version }}
          body: |
            ## Alphonso ${{ needs.determine-tag.outputs.version }}

            ### Installation
            **Windows:** Download `${{ needs.build-windows.outputs.installer_name }}`, run the installer, launch Alphonso.

            **macOS (Apple Silicon):** Download `${{ needs.build-macos.outputs.installer_name }}`, open it, and drag Alphonso to Applications. Apple Silicon only; Intel Macs are not supported by this build. ${{ needs.build-macos.outputs.notarized == 'true' && 'This build is signed and notarized by Apple.' || 'This build is not yet signed by Apple: the first time, right-click Alphonso in Applications and choose Open, then confirm. Updates after that install normally.' }}

            **Linux:** Download `${{ needs.build-linux.outputs.installer_name }}`, mark it executable (`chmod +x`), and run it.

            ### Auto-Update
            If you have a previous version installed, Alphonso will prompt you to update automatically.
          draft: false
          prerelease: false
          files: |
            dist/windows/${{ needs.build-windows.outputs.installer_name }}
            dist/windows/${{ needs.build-windows.outputs.installer_name }}.sig
            dist/macos/${{ needs.build-macos.outputs.installer_name }}
            dist/macos/${{ needs.build-macos.outputs.updater_name }}
            dist/macos/${{ needs.build-macos.outputs.updater_name }}.sig
            dist/linux/${{ needs.build-linux.outputs.installer_name }}
            dist/linux/${{ needs.build-linux.outputs.installer_name }}.sig
            latest.json

      - name: Summary
        run: |
          echo "Release published: Alphonso ${{ needs.determine-tag.outputs.version }}"
          echo "Tag: ${{ needs.determine-tag.outputs.tag }}"
          echo "Windows installer: ${{ needs.build-windows.outputs.installer_name }}"
          echo "macOS installer: ${{ needs.build-macos.outputs.installer_name }}"
          echo "macOS updater archive: ${{ needs.build-macos.outputs.updater_name }}"
          echo "Linux installer: ${{ needs.build-linux.outputs.installer_name }}"
          echo "Updater endpoint: https://github.com/obsidian-media/AlphonsoEcosystem/releases/latest/download/latest.json"
