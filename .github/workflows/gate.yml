name: governance-gate

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: governance-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (secret-scan, doc-freshness, build, test, deploy-dry)
    runs-on: ubuntu-latest
    # Keep a stalled repository verifier from leaving branch CI queued
    # indefinitely behind the governance prerequisite.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run governance verification
        run: bash scripts/verify.sh

      - name: Deploy dry-run (vercel)
        run: |
          if command -v vercel &> /dev/null; then
            vercel build --dry-run
          else
            echo "::notice::vercel CLI not installed, skipping deploy-dry"
            exit 0
          fi
