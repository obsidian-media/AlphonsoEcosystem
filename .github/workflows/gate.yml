name: governance-gate

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  gate:
    name: gate (secret-scan, doc-freshness, build, test, deploy-dry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run governance verification
        run: bash scripts/verify.sh

      - name: Deploy dry-run (vercel)
        run: |
          if command -v vercel &> /dev/null; then
            vercel build --dry-run 2>/dev/null || echo "::notice::Vercel dry-run failed (non-blocking)"
          else
            echo "::notice::vercel CLI not installed, skipping deploy-dry"
            exit 78
          fi
