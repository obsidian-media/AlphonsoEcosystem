apply plugin: 'com.android.application'

android {
    namespace = "com.alphonso.companion"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.alphonso.companion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The desktop's version (the repository's package.json), as on the iPhone. The version
        // code comes from the build (ANDROID_VERSION_CODE), and must go up for Google Play.
        versionCode((System.getenv('ANDROID_VERSION_CODE') ?: '1') as int)
        versionName new groovy.json.JsonSlurper().parse(file('../../../package.json')).version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The email link's domain: the Firebase project's own <project>.firebaseapp.com, read from
        // google-services.json (written by mobile/scripts/firebase-config.mjs at build time).
        def firebaseConfig = file('google-services.json')
        def firebaseProject = firebaseConfig.exists() ? new groovy.json.JsonSlurper().parse(firebaseConfig).project_info.project_id : null
        manifestPlaceholders = [phoneLinkHost: firebaseProject ? "${firebaseProject}.firebaseapp.com" : 'example.invalid']
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The release build is signed only with a key given at build time (Firebase App Distribution,
    // later Google Play); nothing about the key is in the repository.
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Push (Firebase Messaging), opening sealed notices (libsodium), and fingerprint / face.
    implementation platform('com.google.firebase:firebase-bom:35.0.2')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.goterl:lazysodium-android:5.2.0@aar'
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    implementation 'androidx.biometric:biometric:1.1.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
